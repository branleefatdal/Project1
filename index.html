<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11151d">
  <title>Hello, World — The Enchanted Vale</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap');
    :root { color-scheme: dark; --gold:#e8c985; --mist:#d8e0d5; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; overflow:hidden; color:var(--mist); background:#10151a; font-family:'Cormorant Garamond', Georgia, serif; }
    .scene { position:relative; isolation:isolate; display:grid; place-items:center; min-height:100svh; padding:2rem; background: radial-gradient(ellipse at 50% 66%, #d19c4b30 0, transparent 32%), linear-gradient(180deg,#101827 0%,#1b2830 46%,#513c32 78%,#171a1a 100%); }
    .scene::before { content:""; position:absolute; inset:0; z-index:-1; opacity:.3; background-image:radial-gradient(1px 1px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 83% 14%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 68% 32%,#fff 98%,transparent),radial-gradient(1px 1px at 27% 42%,#fff 98%,transparent),radial-gradient(1px 1px at 92% 55%,#fff 98%,transparent),radial-gradient(1px 1px at 6% 60%,#fff 98%,transparent); background-size:370px 290px; }
    .moon { position:absolute; top:10%; left:calc(50% - 105px); width:210px; aspect-ratio:1; border-radius:50%; background:radial-gradient(circle at 35% 32%,#fff7d9,#e5d9ab 45%,#9b987f 100%); box-shadow:0 0 50px #f7e8b577,0 0 150px #d6d39b44; opacity:.82; }
    .moon::after { content:""; position:absolute; inset:8%; border-radius:inherit; background:radial-gradient(ellipse at 64% 33%,#79796628 0 8%,transparent 9%),radial-gradient(ellipse at 33% 62%,#79796620 0 13%,transparent 14%); }
    .ridge { position:absolute; inset:auto 0 0; height:43%; z-index:-1; background:#131a1a; clip-path:polygon(0 40%,10% 25%,17% 36%,28% 8%,37% 34%,47% 17%,58% 42%,69% 10%,78% 36%,87% 18%,100% 37%,100% 100%,0 100%); }
    .ridge.back { height:34%; background:#27302b; opacity:.8; transform:scaleX(-1); }
    .pines { position:absolute; bottom:0; width:100%; height:28%; opacity:.88; background:linear-gradient(135deg,transparent 46%,#0c1111 47% 54%,transparent 55%) 0 0/120px 100%,linear-gradient(45deg,transparent 46%,#111716 47% 54%,transparent 55%) 40px 20px/150px 100%; mask-image:linear-gradient(transparent,#000 35%); }
    .card { position:relative; width:min(720px,100%); padding:clamp(2.5rem,7vw,5rem) 2rem; text-align:center; border:1px solid #e8c98569; outline:1px solid #e8c98528; outline-offset:9px; background:linear-gradient(145deg,#101a1bc9,#131719b8); box-shadow:0 20px 100px #080d0db3,inset 0 0 55px #d6bb5e0a; backdrop-filter:blur(8px); }
    .eyebrow { margin:0 0 1.15rem; color:var(--gold); font:500 .72rem 'Cinzel',serif; letter-spacing:.34em; text-transform:uppercase; }
    h1 { margin:0; color:#f5e9c9; font:500 clamp(2.6rem,8vw,5.5rem)/1.05 'Cinzel',Georgia,serif; letter-spacing:.015em; text-shadow:0 3px 24px #f2d89036; }
    .ornament { display:flex; align-items:center; justify-content:center; gap:1rem; margin:1.7rem auto 1.4rem; color:var(--gold); font-size:1.25rem; }
    .ornament::before,.ornament::after { content:""; display:block; width:72px; height:1px; background:linear-gradient(90deg,transparent,#d7bb77); }
    .ornament::after { transform:scaleX(-1); }
    .subtitle { margin:0; font-size:clamp(1.25rem,3vw,1.65rem); color:#d5d9c9; letter-spacing:.035em; }
    .sigil { position:absolute; top:-17px; left:50%; transform:translateX(-50%); display:grid; place-items:center; width:34px; height:34px; color:var(--gold); border:1px solid #e8c98580; border-radius:50%; background:#182020; font-size:1rem; }
    .foot { position:absolute; bottom:1.7rem; left:0; width:100%; text-align:center; color:#d2c69f8c; font:500 .62rem 'Cinzel',serif; letter-spacing:.3em; text-transform:uppercase; }
    @media (prefers-reduced-motion:no-preference) { .moon { animation:glow 6s ease-in-out infinite alternate; } @keyframes glow { to { box-shadow:0 0 70px #f7e8b599,0 0 180px #d6d39b55; } } }
    @media(max-width:520px) { .moon { width:155px; top:12%; left:calc(50% - 77px); } .card { padding-inline:1.35rem; } .foot { letter-spacing:.18em; } }
  </style>
</head>
<body>
  <main class="scene">
    <div class="moon" aria-hidden="true"></div>
    <div class="ridge back" aria-hidden="true"></div>
    <div class="ridge" aria-hidden="true"></div>
    <div class="pines" aria-hidden="true"></div>
    <section class="card" aria-labelledby="welcome-title">
      <span class="sigil" aria-hidden="true">✦</span>
      <p class="eyebrow">A new tale begins</p>
      <h1 id="welcome-title">Hello, world.</h1>
      <div class="ornament" aria-hidden="true">✧</div>
      <p class="subtitle">Welcome, traveler, to the Enchanted Vale.</p>
    </section>
    <p class="foot">Where every path holds a little magic</p>
  </main>
</body>
</html>
